
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8

%packages --excludedocs
sudo
qemu-guest-agent
openssh-server
%end

firstboot --disable

ignoredisk --only-use=sda
autopart

clearpart --none --initlabel

timezone America/Recife --utc

rootpw --plaintext vagrant
user --groups=wheel --name=vagrant --password=vagrant --plaintext --uid=1000 --gecos="Vagrant" --gid=1000

reboot

%post
%end
